name: Oye Claude APK

on:
  push:
    paths:
      - "oye-claude-android/**"
      - ".github/workflows/oye-claude-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oye-claude-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: oye-claude-android
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Caché del modelo Vosk (vosk-model-small-es-0.42)
        uses: actions/cache@v5
        with:
          path: oye-claude-android/app/src/main/assets/model-es
          key: vosk-model-small-es-0.42

      - name: Pruebas y compilación
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk OyeClaude.apk

      - name: Subir artefacto
        uses: actions/upload-artifact@v6
        with:
          name: OyeClaude-apk
          path: oye-claude-android/OyeClaude.apk
          if-no-files-found: error

      # Release con etiqueta fija: el enlace de descarga nunca cambia y el
      # archivo es un .apk directo (los artefactos de Actions vienen en .zip).
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete oye-claude-latest --yes --cleanup-tag || true
          gh release create oye-claude-latest OyeClaude.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Oye Claude (build #$GITHUB_RUN_NUMBER)" \
            --notes "APK compilado automáticamente desde la rama \`$GITHUB_REF_NAME\` (commit $GITHUB_SHA). Ábrelo desde el teléfono para instalarlo o actualizarlo."
