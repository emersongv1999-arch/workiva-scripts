<title>Senderos Salvajes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: una consola portátil en el centro de la página; horizontal en pantallas anchas, vertical (de bolsillo) en el móvil. */
:root{
  --page:#e4e0ee; --ink:#2a2547; --ink-soft:#5d5684; --rule:#cbc5de; --key:#ffffff;
  --shell:#4b44a3; --shell-hi:#6e66d0; --shell-lo:#2b266e; --bezel:#1e1b38; --bezel-ink:#8f88cf;
  --ab:#e05a62; --ab-hi:#f59098; --ab-lo:#a13646; --pad:#1b192c; --pad-hi:#45406a; --label:#d2cdf7; --led:#ff5468;
  --f-game:'Press Start 2P', ui-monospace, Menlo, monospace;
  --f-label:'Silkscreen', 'Press Start 2P', ui-monospace, monospace;
  --f-body:'VT323', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#100e22; --ink:#dcd8f7; --ink-soft:#958ec8; --rule:#2a2650; --key:#1e1b3a; color-scheme:dark } }
:root[data-theme="dark"]{ --page:#100e22; --ink:#dcd8f7; --ink-soft:#958ec8; --rule:#2a2650; --key:#1e1b3a; color-scheme:dark }
html,body{height:100%}
body{background:var(--page); color:var(--ink); font-family:var(--f-body); font-size:20px; line-height:1.2; -webkit-tap-highlight-color:transparent}
.stage{min-height:100%; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  padding-block:16px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.device{--sw:min(calc(100vw - 64px), 560px); position:relative; display:grid; grid-template-columns:1fr 1fr; grid-template-areas:"bezel bezel" "logo logo" "dpad ab" "ss ss";
  align-items:center; gap:10px 8px; padding:12px 12px 26px; max-width:100%; box-sizing:border-box;
  background:linear-gradient(160deg, var(--shell-hi), var(--shell) 42%, var(--shell-lo)); border-radius:18px 18px 60px 18px;
  box-shadow:0 2px 0 rgba(255,255,255,.22) inset, 0 -6px 0 rgba(0,0,0,.22) inset, 0 18px 40px rgba(20,10,60,.32);
  user-select:none; -webkit-user-select:none; touch-action:manipulation}
@media (min-width:900px) and (min-aspect-ratio:5/4){
  .device{--sw:min(56vw, calc((100vh - 190px) * 1.5), 840px); grid-template-columns:auto auto auto; grid-template-areas:"dpad bezel ab" "dpad logo ab" "ss ss ss"; border-radius:46px; padding:22px 34px 18px; gap:8px 30px} }
.device:fullscreen{width:100vw; height:100vh; border-radius:0; justify-content:center; align-content:center; --sw:min(64vw, calc((100vh - 120px) * 1.5))}
.bezel{grid-area:bezel; background:var(--bezel); border-radius:10px 10px 32px 10px; padding:6px 10px 12px; box-shadow:0 0 0 2px rgba(0,0,0,.25) inset; min-width:0}
.bezel-top{display:flex; align-items:center; gap:8px; font-family:var(--f-label); font-size:11px; letter-spacing:.14em; color:var(--bezel-ink); padding:2px 2px 7px; text-transform:uppercase}
.led{width:8px; height:8px; border-radius:50%; background:var(--led); box-shadow:0 0 8px var(--led); flex:none}
.bezel-top .sp{flex:1; height:2px; min-width:10px; background:repeating-linear-gradient(90deg, var(--bezel-ink) 0 10px, transparent 10px 14px); opacity:.45}
.screen{position:relative; width:var(--sw); max-width:100%; aspect-ratio:3/2; background:#000; overflow:hidden; border-radius:2px; --px:2px}
#gl{position:absolute; inset:0; width:100%; height:100%; image-rendering:crisp-edges; image-rendering:pixelated}
.logo{grid-area:logo; text-align:center; font-family:var(--f-label); font-weight:700; color:var(--label); letter-spacing:.2em; font-size:17px; text-shadow:0 2px 0 rgba(0,0,0,.25)}
.logo em{font-style:normal; font-weight:400; font-size:10px; letter-spacing:.32em; opacity:.75; margin-left:6px}
.dpad{grid-area:dpad; justify-self:center; position:relative; width:128px; height:128px; touch-action:none; cursor:pointer; border-radius:50%}
.dpad::before{content:''; position:absolute; inset:6px; border-radius:50%; background:rgba(0,0,0,.14)}
.dpad i{position:absolute; width:42px; height:42px; background:var(--pad); pointer-events:none; display:grid; place-items:center; box-shadow:0 3px 0 rgba(0,0,0,.45)}
.dpad i::after{content:''; width:0; height:0; border:7px solid transparent}
.dpad .u{left:43px; top:2px; border-radius:6px 6px 0 0} .dpad .u::after{border-bottom-color:var(--pad-hi); margin-top:-8px}
.dpad .d{left:43px; bottom:2px; border-radius:0 0 6px 6px} .dpad .d::after{border-top-color:var(--pad-hi); margin-bottom:-8px}
.dpad .l{top:43px; left:2px; border-radius:6px 0 0 6px} .dpad .l::after{border-right-color:var(--pad-hi); margin-left:-8px}
.dpad .r{top:43px; right:2px; border-radius:0 6px 6px 0} .dpad .r::after{border-left-color:var(--pad-hi); margin-right:-8px}
.dpad .c{left:43px; top:43px; box-shadow:none} .dpad .c::after{display:none}
.dpad i.on{background:var(--pad-hi)} .dpad i.on::after{filter:brightness(1.8)}
.ab{grid-area:ab; justify-self:center; display:flex; align-items:flex-start; gap:14px; transform:rotate(-24deg); padding:14px 4px}
.btn{font-family:var(--f-label); border:0; cursor:pointer; touch-action:none; -webkit-user-select:none; user-select:none}
.btn:focus-visible{outline:3px solid var(--label); outline-offset:3px}
.round{width:58px; height:58px; border-radius:50%; color:var(--ab-lo); font-size:15px; font-weight:700; position:relative;
  background:radial-gradient(circle at 34% 30%, var(--ab-hi), var(--ab) 52%, var(--ab-lo)); box-shadow:0 4px 0 rgba(0,0,0,.38), 0 0 0 5px rgba(0,0,0,.12)}
.round span{position:absolute; left:0; right:0; top:66px; text-align:center; color:var(--label); font-size:13px; letter-spacing:.1em}
.round.on{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.38), 0 0 0 5px rgba(0,0,0,.12)}
.ab .b{margin-top:24px}
.ss{grid-area:ss; display:flex; justify-content:center; gap:22px; padding-top:4px}
.pill{width:56px; height:13px; border-radius:8px; background:var(--pad); box-shadow:0 3px 0 rgba(0,0,0,.4); position:relative; transform:rotate(-24deg)}
.pill span{position:absolute; left:-10px; right:-10px; top:18px; text-align:center; color:var(--label); font-size:10px; letter-spacing:.14em}
.pill.on{background:var(--pad-hi); transform:rotate(-24deg) translateY(2px)}
.grille{position:absolute; right:26px; bottom:20px; display:flex; gap:6px; transform:rotate(-24deg); pointer-events:none}
.grille i{width:5px; height:34px; border-radius:3px; background:rgba(0,0,0,.25)}
@media (min-width:900px) and (min-aspect-ratio:5/4){ .grille{right:40px; bottom:18px} }
.manual{width:min(100%, 860px); display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px 20px; color:var(--ink-soft); font-size:20px}
.manual .keys{display:flex; flex-wrap:wrap; justify-content:center; gap:6px 18px; min-width:0}
.manual kbd{font-family:var(--f-label); font-size:12px; color:var(--ink); background:var(--key); border:1px solid var(--rule); border-bottom-width:3px; border-radius:5px; padding:1px 6px; margin-right:2px}
.manual .tools{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.manual button{font-family:var(--f-label); font-size:12px; letter-spacing:.08em; color:var(--ink); background:transparent; border:2px solid var(--rule); border-radius:8px; padding:6px 10px; cursor:pointer}
.manual button:hover{border-color:var(--ink-soft)} .manual button:focus-visible{outline:3px solid var(--ink-soft); outline-offset:2px}
.touchhint{display:none}
@media (hover:none){ .manual .keys{display:none} .touchhint{display:block} }
@media (max-width:420px){ .device{padding:10px 10px 24px; --sw:calc(100vw - 52px)} .bezel{padding:5px 6px 10px} .dpad{width:118px; height:118px} .dpad i{width:38px; height:38px} .dpad .u,.dpad .d,.dpad .c{left:40px} .dpad .l,.dpad .r,.dpad .c{top:40px} .round{width:52px; height:52px} .round span{top:60px} }

/* ---------- Interfaz dentro de la pantalla (unidades = píxeles del juego) ---------- */
.screen{--ui-bg:#f8f8f0; --ui-ink:#2c2c3c; --ui-line:#384870; --ui-line2:#78c0e0; --ui-dim:#8a8a9a; --ui-sel:#dcecf8; --ui-page:#e8dfc8; --ui-hot:#e8703a;
  --hp-hi:#48c058; --hp-mid:#e8b830; --hp-lo:#e04838; --exp:#4890e0; --hp-track:#4a4a5c; --hp-lbl:#e8a030}
.screen[data-pal="dmg"]{--ui-bg:#c4d48a; --ui-ink:#0f380f; --ui-line:#0f380f; --ui-line2:#306230; --ui-dim:#4f6f2f; --ui-sel:#a8bc68; --ui-page:#9bbc0f; --ui-hot:#0f380f;
  --hp-hi:#306230; --hp-mid:#306230; --hp-lo:#0f380f; --exp:#306230; --hp-track:#8bac0f; --hp-lbl:#306230}
.screen[data-pal="dmg"] .ui img{filter:grayscale(1) sepia(1) hue-rotate(38deg) saturate(2.4) brightness(.78)}
.screen[data-pal="dmg"] .tt, .screen[data-pal="dmg"] .tdot{background:var(--ui-line2)!important; color:var(--ui-bg)}
.ui{position:absolute; inset:0; font-family:var(--f-game); font-size:calc(var(--px)*8); line-height:calc(var(--px)*12); color:var(--ui-ink); pointer-events:none; letter-spacing:0}
.ui b{font-weight:normal}
.box{position:absolute; box-sizing:border-box; background:var(--ui-bg); color:var(--ui-ink); border:calc(var(--px)*2) solid var(--ui-line); border-radius:calc(var(--px)*4);
  box-shadow:inset 0 0 0 calc(var(--px)*1) var(--ui-bg), inset 0 0 0 calc(var(--px)*2) var(--ui-line2); padding:calc(var(--px)*5) calc(var(--px)*7)}
.dim{color:var(--ui-dim)}
.tb{left:calc(var(--px)*4); right:calc(var(--px)*4); bottom:calc(var(--px)*4); height:calc(var(--px)*46); padding:calc(var(--px)*7) calc(var(--px)*10)}
.tb.narrow{right:calc(var(--px)*158)}
.tbt{white-space:pre; line-height:calc(var(--px)*16)}
.arrow{position:absolute; right:calc(var(--px)*9); bottom:calc(var(--px)*7); width:0; height:0; border-left:calc(var(--px)*4) solid transparent; border-right:calc(var(--px)*4) solid transparent; border-top:calc(var(--px)*5) solid var(--ui-hot); animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(calc(var(--px)*2))}}
.menu .row{position:relative; padding-left:calc(var(--px)*10); white-space:nowrap; line-height:calc(var(--px)*14)}
.row.sel::before{content:''; position:absolute; left:0; top:calc(var(--px)*3); border-top:calc(var(--px)*4) solid transparent; border-bottom:calc(var(--px)*4) solid transparent; border-left:calc(var(--px)*5) solid var(--ui-ink)}
.row.dis{color:var(--ui-dim)}
.bmenu{display:grid; grid-template-columns:1fr 1fr; align-content:center; padding:calc(var(--px)*5) calc(var(--px)*6)}
.bmenu .row{line-height:calc(var(--px)*16)}
.mlist{padding:calc(var(--px)*6) calc(var(--px)*8)} .mlist .row{line-height:calc(var(--px)*12.5)}
.minfo{padding:calc(var(--px)*6) calc(var(--px)*8); line-height:calc(var(--px)*15)}
.tt{display:inline-block; color:#fff; padding:0 calc(var(--px)*3); border-radius:calc(var(--px)*2); line-height:calc(var(--px)*10); margin-top:calc(var(--px)*2); text-shadow:calc(var(--px)*1) calc(var(--px)*1) 0 rgba(0,0,0,.35)}
.tdot{display:inline-block; width:calc(var(--px)*6); height:calc(var(--px)*6); border-radius:calc(var(--px)*1); margin-right:calc(var(--px)*4); flex:none}
.stt{font-style:normal; background:var(--hp-lo); color:var(--ui-bg); padding:0 calc(var(--px)*2); margin-right:calc(var(--px)*3); border-radius:calc(var(--px)*2)}
.gotc{display:inline-block; width:calc(var(--px)*6); height:calc(var(--px)*6); border-radius:50%; background:var(--ui-line2); border:calc(var(--px)*1) solid var(--ui-line); vertical-align:middle}
.hud{padding:calc(var(--px)*4) calc(var(--px)*7) calc(var(--px)*5)}
.hud .hn{display:flex; justify-content:space-between; align-items:center; gap:calc(var(--px)*4); white-space:nowrap}
.hud .hn b{overflow:hidden}
.hud .gotc{position:absolute; left:calc(var(--px)*-4); top:calc(var(--px)*-4)}
.hpw{display:flex; align-items:center; gap:calc(var(--px)*3); margin-top:calc(var(--px)*3)}
.hpl{color:var(--hp-lbl); flex:none}
.hpbar{flex:1; display:block; position:relative; height:calc(var(--px)*5); min-width:calc(var(--px)*30); background:var(--hp-track); border:calc(var(--px)*1) solid var(--ui-line); border-radius:calc(var(--px)*2); overflow:hidden}
.hpbar i{position:absolute; left:0; top:0; bottom:0}
.hpnum{text-align:right; margin-top:calc(var(--px)*1); line-height:calc(var(--px)*11)}
.expb{height:calc(var(--px)*3); background:var(--hp-track); margin-top:calc(var(--px)*2); position:relative; border-radius:calc(var(--px)*1); overflow:hidden}
.expb i{position:absolute; left:0; top:0; bottom:0; background:var(--exp)}
.banner{transform:translateY(-220%); transition:transform .35s steps(6); padding:calc(var(--px)*4) calc(var(--px)*10); white-space:nowrap}
.banner.in{transform:none}
.iconpop{display:grid; place-items:center; padding:calc(var(--px)*4)} .iconpop img{width:calc(var(--px)*56); height:calc(var(--px)*56); image-rendering:pixelated}
.page{position:absolute; inset:0; background:var(--ui-page)}
.btitle{color:var(--ui-line); margin-bottom:calc(var(--px)*2); display:flex; justify-content:space-between}
.hint{position:absolute; left:0; right:0; bottom:calc(var(--px)*4); text-align:center; color:var(--ui-dim)}
/* equipo */
.plist{position:absolute; left:calc(var(--px)*4); right:calc(var(--px)*4); top:calc(var(--px)*4); bottom:calc(var(--px)*30); display:flex; flex-direction:column; gap:calc(var(--px)*2)}
.prow{position:relative; flex:1; min-height:0; display:flex; align-items:center; gap:calc(var(--px)*4); padding:0 calc(var(--px)*5); background:var(--ui-bg); border:calc(var(--px)*1) solid var(--ui-line); border-radius:calc(var(--px)*3); box-shadow:none; line-height:calc(var(--px)*10)}
.prow.sel{background:var(--ui-sel); border-color:var(--ui-hot); box-shadow:inset 0 0 0 calc(var(--px)*1) var(--ui-hot)}
.prow.swap{border-style:dashed}
.prow.ko .ic{opacity:.45}
.ic{width:calc(var(--px)*20); height:calc(var(--px)*20); image-rendering:pixelated; flex:none}
.pinfo{flex:1; min-width:0}
.pl1, .pl2{display:flex; align-items:center; justify-content:space-between; gap:calc(var(--px)*3)}
.pl2 .hpbar{max-width:calc(var(--px)*90)}
.hpn{min-width:calc(var(--px)*44); text-align:right}
.pmsg{left:calc(var(--px)*4); right:calc(var(--px)*4); bottom:calc(var(--px)*4); height:calc(var(--px)*24); padding:calc(var(--px)*4) calc(var(--px)*8); line-height:calc(var(--px)*12)}
/* datos */
.sumT{left:calc(var(--px)*4); right:calc(var(--px)*4); top:calc(var(--px)*4); height:calc(var(--px)*32); line-height:calc(var(--px)*11)}
.sumT .l1, .sumT .l2{display:flex; justify-content:space-between; align-items:center; gap:calc(var(--px)*4)}
.sumA{left:calc(var(--px)*4); top:calc(var(--px)*40); width:calc(var(--px)*100); bottom:calc(var(--px)*4); text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--px)*4)}
.bigic{width:calc(var(--px)*64); height:calc(var(--px)*64); image-rendering:pixelated; display:block}
.bigic.unk{display:grid; place-items:center; color:var(--ui-dim)}
.sumB{left:calc(var(--px)*108); right:calc(var(--px)*4); top:calc(var(--px)*40); height:calc(var(--px)*70); line-height:calc(var(--px)*9.5); padding:calc(var(--px)*4) calc(var(--px)*8)}
.srow{display:flex; justify-content:space-between} .srow .up{color:var(--hp-lo)} .srow .dn{color:var(--exp)}
.sumC{left:calc(var(--px)*108); right:calc(var(--px)*4); top:calc(var(--px)*114); bottom:calc(var(--px)*4); padding:calc(var(--px)*5) calc(var(--px)*8)}
.mrow{display:flex; align-items:center; line-height:calc(var(--px)*14)} .mrow .mn{flex:1; white-space:nowrap} .mrow .mp{color:var(--ui-dim)}
/* mochila / tienda */
.bagL{left:calc(var(--px)*4); right:calc(var(--px)*4); top:calc(var(--px)*4); height:calc(var(--px)*122)}
.bagL .row, .shopL .row{display:flex; justify-content:space-between; position:relative; padding-left:calc(var(--px)*10); line-height:calc(var(--px)*13)}
.bagD{left:calc(var(--px)*4); right:calc(var(--px)*4); bottom:calc(var(--px)*4); height:calc(var(--px)*60); line-height:calc(var(--px)*12)}
.shopL{left:calc(var(--px)*4); top:calc(var(--px)*4); right:calc(var(--px)*4); height:calc(var(--px)*124); padding:calc(var(--px)*5) calc(var(--px)*7)}
.shopL .row{line-height:calc(var(--px)*11)}
.shopD{top:auto; height:calc(var(--px)*56)}
.qty{display:flex; justify-content:space-between}
/* registro */
.dexL{left:calc(var(--px)*4); top:calc(var(--px)*4); bottom:calc(var(--px)*4); width:calc(var(--px)*146)}
.dexL .row{position:relative; padding-left:calc(var(--px)*10); line-height:calc(var(--px)*15); white-space:nowrap}
.dexR{left:calc(var(--px)*154); right:calc(var(--px)*4); top:calc(var(--px)*4); bottom:calc(var(--px)*4); text-align:center; display:flex; flex-direction:column; align-items:center; gap:calc(var(--px)*2); padding:calc(var(--px)*5) calc(var(--px)*6)}
.dexR .bigic{width:calc(var(--px)*48); height:calc(var(--px)*48)}
.ddesc{text-align:left; line-height:calc(var(--px)*11); margin-top:calc(var(--px)*2)}
/* nombre */
.ntitle{left:calc(var(--px)*4); right:calc(var(--px)*4); top:calc(var(--px)*4); height:calc(var(--px)*24); padding:calc(var(--px)*4) calc(var(--px)*8); text-align:center}
.nval{left:calc(var(--px)*64); right:calc(var(--px)*64); top:calc(var(--px)*32); height:calc(var(--px)*24); padding:calc(var(--px)*4) calc(var(--px)*8); letter-spacing:calc(var(--px)*2)}
.caret{display:inline-block; width:calc(var(--px)*6); height:calc(var(--px)*8); background:var(--ui-hot); vertical-align:middle; animation:bob .7s steps(2) infinite}
.ngrid{left:calc(var(--px)*4); right:calc(var(--px)*4); top:calc(var(--px)*60); bottom:calc(var(--px)*18); display:grid; grid-template-columns:repeat(9, 1fr); align-content:space-evenly; text-align:center; padding:calc(var(--px)*4)}
.ngrid span{line-height:calc(var(--px)*18); border-radius:calc(var(--px)*2)}
.ngrid span.sel{background:var(--ui-hot); color:var(--ui-bg)}
/* ficha, opciones, menú */
.cardB{left:calc(var(--px)*20); right:calc(var(--px)*20); top:calc(var(--px)*12); bottom:calc(var(--px)*12); padding:calc(var(--px)*8) calc(var(--px)*12)}
.crow, .orow{display:flex; justify-content:space-between; line-height:calc(var(--px)*15)}
.badges{display:flex; gap:calc(var(--px)*8); justify-content:center; margin-top:calc(var(--px)*8)}
.badge{padding:calc(var(--px)*3) calc(var(--px)*6); border:calc(var(--px)*1) dashed var(--ui-dim); color:var(--ui-dim); border-radius:calc(var(--px)*3)}
.badge.got{background:var(--bc); color:#fff; border-style:solid; border-color:var(--ui-line); text-shadow:calc(var(--px)*1) calc(var(--px)*1) 0 rgba(0,0,0,.35)}
.screen[data-pal="dmg"] .badge.got{background:var(--ui-line2)}
.optB{left:calc(var(--px)*20); right:calc(var(--px)*20); top:calc(var(--px)*36); padding:calc(var(--px)*8) calc(var(--px)*12); height:calc(var(--px)*108)}
.optB .hint{bottom:calc(var(--px)*6)}
.orow{position:relative; padding-left:calc(var(--px)*10); line-height:calc(var(--px)*17)}
.orow.sel::before{content:''; position:absolute; left:0; top:calc(var(--px)*4); border-top:calc(var(--px)*4) solid transparent; border-bottom:calc(var(--px)*4) solid transparent; border-left:calc(var(--px)*5) solid var(--ui-ink)}
.sinfo{line-height:calc(var(--px)*12)}
/* título y créditos */
.page.title{background:transparent}
.tlogo{position:absolute; left:0; right:0; top:calc(var(--px)*14); text-align:center}
.tl1, .tl2{font-size:calc(var(--px)*22); line-height:calc(var(--px)*24); color:#ffe27a; text-shadow:calc(var(--px)*2) calc(var(--px)*2) 0 #c0502a, calc(var(--px)*4) calc(var(--px)*4) 0 #2a1a4a; letter-spacing:calc(var(--px)*2)}
.tl2{color:#9af0ff; text-shadow:calc(var(--px)*2) calc(var(--px)*2) 0 #3a6ad0, calc(var(--px)*4) calc(var(--px)*4) 0 #2a1a4a}

// ---------- Interacción ----------
function worldPress(b){
  if (G.mode !== 'world') return;
  if (PL.moving){ if (b === 'a' || b === 'start') G.queued = b; return; }
  if (DIRSET.has(b)){ if (PL.dir !== b){ PL.dir = b; PL.turnWait = .1; } return; }
  if (b === 'a') runScript(interact);
  else if (b === 'start') runScript(startMenu);
  else if (b === 'select') cyclePalette();
}
async function interact(){
  const [dx,dy] = DIRS[PL.dir], fx = PL.x+dx, fy = PL.y+dy, t = tileAt(fx, fy);
  let n = npcAt(fx, fy);
  if (!n && t === 'c') n = npcAt(fx+dx, fy+dy);
  if (n) return talkTo(n);
  const sign = WS.map.signs && WS.map.signs[fx+','+fy];
  if (sign) return say(typeof sign === 'function' ? sign() : sign);
  if (t === 'P') return pcScreen();
  if (t === '~' && G.bag.cana && WS.map.fish) return fish();
  if (TILE_INFO[t]) return say(TILE_INFO[t]);
}
async function talkTo(n){
  const d = n.def;
  if (d.item) return pickupItem(n);
  if (d.starter) return chooseStarter(n);
  if (!d.creature) n.dir = OPP[PL.dir];
  if (d.trainer && !G.flags[n.id]) return trainerBattle(n);
  if (d.trainer) return say(...[].concat(d.trainer.after));
  if (d.talk) return d.talk(n);
  if (d.text) return say(...[].concat(typeof d.text === 'function' ? d.text() : d.text));
}
async function trainerSpotted(n, dist){
  const tr = n.def.trainer; AU.play(tr.leader || tr.rival ? 'boss' : 'battle');
  showExcl(n); AU.sfx('excl'); await wait(750);
  for (let i = 1; i < dist; i++) await npcStep(n, n.dir);
  PL.dir = OPP[n.dir];
  await trainerBattle(n);
}
async function trainerBattle(n){
  const tr = n.def.trainer;
  if (tr.intro) await say(...[].concat(tr.intro));
  const res = await battle({trainer:tr, npc:n, env:WS.map.env});
  if (res === 'win'){ G.flags[n.id] = 1; if (tr.badge) G.flags[tr.badge] = 1; if (tr.onWin) await tr.onWin(); else if (tr.after) await say(...[].concat(tr.after)); }
}
async function wildBattle(mon){ await battle({wild:mon, env:WS.map.env}); }
async function pickupItem(n){ G.flags[n.id] = 1; removeNpc(n); await giveItem(n.def.item, n.def.n || 1, true); }
async function giveItem(id, n=1, found){ G.bag[id] = (G.bag[id] || 0) + n; AU.sfx('item'); await say(`¡{P} ${found ? 'encontró' : 'recibió'} ${ITEMS[id].n}${n > 1 ? ' x'+n : ''}!`); }
function healAll(){ for (const m of G.party){ m.hp = stats(m).hp; m.status = null; m.slp = 0; m.moves.forEach(v => v.pp = MOVES[v.id].pp); } }
async function fish(){
  if (!(await ask('¿Quieres pescar con la CAÑA VIEJA?'))) return;
  AU.sfx('splash'); await say('. . .', {auto:700 + rnd()*900});
  if (rnd() < .75 && G.party.some(m => m.hp > 0)){ AU.sfx('excl'); await say('¡Algo ha picado!'); await wildBattle(rollList(WS.map.fish)); }
  else await say('No pica nada...');
}
async function nurseTalk(){
  await say('¡Bienvenido al REFUGIO!', 'Aquí cuidamos de las criaturas cansadas.');
  if (!G.party.length) return say('Vuelve cuando tengas alguna criatura. ¡Te esperamos!');
  if (await ask('¿Quieres que cure a tus criaturas?')){
    await say('¡De acuerdo! Déjamelas un momento...', {auto:500});
    tbHide(); AU.sfx('heal'); await wait(1400); healAll();
    G.lastHeal = {map:'refugio', x:5, y:3, dir:'up', ret:Object.assign({}, G.ret), variant:G.variant};
    await say('¡Gracias por esperar! Tus criaturas están en plena forma.', '¡Vuelve cuando quieras!');
  } else await say('¡Vuelve cuando quieras!');
}
async function chooseStarter(n){
  const sp = n.def.starter, s = SP[sp];
  if (G.party.length) return say('Es la última criatura que queda. La PROFESORA cuidará de ella.');
  const ic = showIcon(sp);
  const yes = await ask(`¿Eliges a ${s.n}, la criatura de tipo ${TYPES[s.t[0]].n}?`);
  ic.remove();
  if (!yes) return;
  const m = makeMon(sp, 5); G.party.push(m); G.flags.starter = sp; markSeen(sp, true);
  removeNpc(n); AU.sfx('caught'); AU.cry(s.num);
  await say(`¡{P} recibió a ${s.n}!`);
  if (await ask(`¿Quieres ponerle un mote a ${s.n}?`)){ const nn = await nameEntry(`MOTE PARA ${s.n}`); if (nn) m.nick = nn; }
  const rsp = COUNTER[sp]; G.flags.rivalSp = rsp; markSeen(rsp);
  const r = npcById('rival'), o = WS.npcs.find(e => e.def.starter === rsp);
  await say('{R}: ¡Pues yo me quedo con este!');
  if (r && o){ await npcWalkTo(r, o.x, 5, 'xy'); await npcWalkTo(r, o.x, 4, 'yx'); r.dir = 'up'; await wait(250); removeNpc(o); AU.sfx('ok'); }
  await say(`¡{R} recibió a ${SP[rsp].n}!`, 'PROFESORA: ¡Estupendo! Cuidad bien de vuestras criaturas.');
}

// ================= INTERFAZ =================
const UI = $('#ui');
function el(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function place(e, o){ ['left','right','top','bottom','width','height'].forEach(k => { const v = o[k[0]] ?? o[k]; if (v != null) e.style[k] = U(v); }); }
function mkBox(cls, o={}){ const b = el('div', 'box '+(cls||'')); place(b, o); (o.parent || UI).appendChild(b); return b; }
const fmt = s => String(s).replace(/\{P\}/g, G.name || 'ALEX').replace(/\{R\}/g, G.rival || 'GAEL');

// ---------- Cuadro de texto con máquina de escribir ----------
const TB = {box:null, txt:null, arrow:null, target:'', shown:0, typing:null};
function tbEnsure(){ if (TB.box) return; TB.box = el('div', 'box tb'); TB.txt = el('div', 'tbt'); TB.arrow = el('i', 'arrow'); TB.box.append(TB.txt, TB.arrow); TB.box.hidden = true; UI.appendChild(TB.box); }
function tbShow(narrow){ tbEnsure(); TB.box.hidden = false; TB.box.classList.toggle('narrow', !!narrow); }
function tbHide(){ if (TB.box){ TB.box.hidden = true; TB.txt.textContent = ''; TB.arrow.hidden = true; } }
function tbSet(text, narrow){ tbShow(narrow); TB.txt.textContent = wrapText(fmt(text), narrow ? 13 : 31).slice(0,2).join('\n'); TB.arrow.hidden = true; }
function wrapText(text, cols){
  const lines = [];
  for (const para of text.split('\n')){ let cur = '';
    for (const w of para.split(' ')){ if (!w) continue; if (!cur.length) cur = w; else if ((cur+' '+w).length <= cols) cur += ' '+w; else { lines.push(cur); cur = w; } }
    lines.push(cur); }
  return lines;
}
function tbUpdate(dt){
  if (!TB.typing) return;
  const sp = [28, 48, 400][G.opts.text ?? 1] * ((Input.held.has('a') || Input.held.has('b')) ? 3 : 1);
  TB.shown = Math.min(TB.target.length, TB.shown + dt*sp);
  TB.txt.textContent = TB.target.slice(0, Math.floor(TB.shown));
  if (TB.shown >= TB.target.length){ const r = TB.typing; TB.typing = null; r(); }
}
function typeOut(str){ return new Promise(res => { TB.target = str; TB.shown = 0; TB.txt.textContent = ''; TB.typing = res;
  const h = b => { if (b === 'a' || b === 'b'){ TB.shown = TB.target.length; } };
  Input.push(h); const done = TB.typing; TB.typing = () => { Input.pop(h); done(); }; }); }
async function say(...args){
  let o = {}; if (args.length && typeof args[args.length-1] === 'object') o = args.pop();
  for (let a = 0; a < args.length; a++){
    const lines = wrapText(fmt(args[a]), o.narrow ? 13 : 31);
    for (let i = 0; i < lines.length; i += 2){
      tbShow(o.narrow); TB.arrow.hidden = true;
      await typeOut(lines.slice(i, i+2).join('\n'));
      const last = a === args.length-1 && i+2 >= lines.length;
      if (o.auto != null && last){ await waitBtn(['a','b'], o.auto); }
      else if (last && o.keep){ /* sin espera */ }
      else { TB.arrow.hidden = false; await waitBtn(['a','b']); AU.sfx('sel'); TB.arrow.hidden = true; }
    }
  }
  if (!o.keep) tbHide();
}
async function ask(text, opts=['SÍ','NO']){
  await say(text, {keep:true});
  const r = await choose(opts, {r:4, b:52, w:56});
  tbHide(); return r === 0;
}

// ---------- Menús ----------
async function choose(items, o={}){
  const box = mkBox('menu '+(o.cls||''), o); const n = items.length; let i = clamp(o.start || 0, 0, n-1);
  const draw = () => { box.innerHTML = items.map((t,k) => `<div class="row${k===i?' sel':''}${t && t.dis?' dis':''}">${esc(fmt(t && t.t != null ? t.t : t))}</div>`).join(''); if (o.onMove) o.onMove(i); };
  draw();
  const cancelBtns = o.cancelBtns || ['b'];
  while (true){
    const b = await waitBtn(['up','down','left','right','a','b','start']);
    const g = o.grid || 1;
    if (b === 'up'){ i = g > 1 ? (i-g+n)%n : (i-1+n)%n; AU.sfx('sel'); draw(); }
    else if (b === 'down'){ i = g > 1 ? (i+g)%n : (i+1)%n; AU.sfx('sel'); draw(); }
    else if ((b === 'left' || b === 'right') && g > 1){ i = i%g === 0 ? i+1 : i-1; i = clamp(i, 0, n-1); AU.sfx('sel'); draw(); }
    else if (b === 'a'){ AU.sfx('ok'); box.remove(); return i; }
    else if (cancelBtns.includes(b) && o.cancel !== false){ AU.sfx('sel'); box.remove(); return -1; }
  }
}
function banner(name){
  const b = mkBox('banner', {l:6, t:-30}); b.textContent = name;
  requestAnimationFrame(() => b.classList.add('in'));
  setTimeout(() => { b.classList.remove('in'); setTimeout(() => b.remove(), 400); }, 2300);
}
function showIcon(id){ const b = mkBox('iconpop', {l:108, t:30, w:72, h:72}); const src = iconOf(id); b.innerHTML = src ? `<img alt="" src="${src}">` : ''; return b; }
function page(cls){ const p = el('div', 'page '+(cls||'')); UI.appendChild(p); return p; }
function hpColor(f){ return f > .5 ? 'var(--hp-hi)' : f > .2 ? 'var(--hp-mid)' : 'var(--hp-lo)'; }
function hpBarHTML(hp, max){ const f = max ? hp/max : 0; return `<span class="hpbar"><i style="width:${(f*100).toFixed(1)}%;background:${hpColor(f)}"></i></span>`; }
function typeTag(t){ return `<span class="tt" style="background:${TYPES[t].c}">${TYPES[t].n}</span>`; }
function iconImg(id, cls='ic'){ const s = iconOf(id); return s ? `<img class="${cls}" alt="" src="${s}">` : `<span class="${cls}"></span>`; }

async function partyScreen(mode='menu'){
  const pg = page('party'); let i = 0, swap = -1, result = -1;
  const msgFor = () => swap >= 0 ? '¿Con cuál la cambias?' : mode === 'item' ? '¿En qué criatura lo usas?' : mode === 'forced' ? 'Elige la siguiente criatura.' : mode === 'battle' ? '¿Qué criatura quieres enviar?' : mode === 'deposit' ? '¿Qué criatura dejas en la CAJA?' : 'Elige una criatura.';
  const draw = () => {

function useItemOn(id, m){
  const it = ITEMS[id], st = stats(m), nm = mname(m);
  if (it.revive){ if (m.hp > 0) return {ok:false, msg:'No tendría ningún efecto.'}; m.hp = Math.floor(st.hp/2); m.status = null; G.bag[id]--; return {ok:true, msg:`¡${nm} se ha reanimado!`}; }
  if (m.hp <= 0) return {ok:false, msg:`¡${nm} está debilitado!`};
  if (it.heal){ if (m.hp >= st.hp) return {ok:false, msg:'No tendría ningún efecto.'}; const a = Math.min(it.heal, st.hp - m.hp); m.hp += a; G.bag[id]--; return {ok:true, msg:`${nm} recuperó ${a} PS.`, amount:a}; }
  if (it.cure){ if (!m.status) return {ok:false, msg:'No tendría ningún efecto.'}; m.status = null; m.slp = 0; G.bag[id]--; return {ok:true, msg:`¡${nm} se ha recuperado!`}; }
  return {ok:false, msg:'No se puede usar.'};
}

const NAME_CH = 'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('').concat(['-','.','!','?','1','2','3','←','FIN']);
function nameEntry(title, def=''){
  const pg = page('name'); let name = def, i = 0;
  const draw = () => { pg.innerHTML = `<div class="box ntitle">${esc(title)}</div><div class="box nval">${esc(name)}<i class="caret"></i></div>
    <div class="box ngrid">${NAME_CH.map((c,k) => `<span class="${k===i?'sel':''}${c.length>1?' wide':''}">${c}</span>`).join('')}</div><div class="hint">TECLADO O A · START = FIN</div>`; };
  draw();
  return new Promise(res => {
    const finish = () => { if (!name.length){ AU.sfx('bump'); return; } Input.pop(h); Input.rawHook = null; AU.sfx('ok'); pg.remove(); res(name); };
    const add = c => { if (name.length < 8){ name += c; AU.sfx('sel'); } };
    const h = b => { const cols = 9, n = NAME_CH.length;
      if (b === 'left') i = (i-1+n)%n; else if (b === 'right') i = (i+1)%n; else if (b === 'up') i = (i-cols+n)%n; else if (b === 'down') i = (i+cols)%n;
      else if (b === 'b'){ name = name.slice(0,-1); AU.sfx('sel'); }
      else if (b === 'start') return finish();
      else if (b === 'a'){ const c = NAME_CH[i]; if (c === '←') name = name.slice(0,-1); else if (c === 'FIN') return finish(); else add(c); }
      draw(); };
    Input.push(h);
    Input.rawHook = e => {
      if (e.key === 'Enter'){ finish(); return true; }
      if (e.key === 'Backspace'){ name = name.slice(0,-1); draw(); return true; }
      if (e.key && e.key.length === 1 && /[a-zñ0-9.!?-]/i.test(e.key)){ add(e.key.toUpperCase()); draw(); return true; }
      return false; };
  });
}

// ================= CRIATURAS =================
function mname(m){ return m.nick || SP[m.sp].n; }
function expAt(l){ return l <= 1 ? 0 : l*l*l; }
function expFrac(m){ if (m.lvl >= 100) return 1; const a = expAt(m.lvl), b = expAt(m.lvl+1); return clamp((m.exp - a)/(b - a), 0, 1); }
function stats(m){
  const b = SP[m.sp].b, n = NATURES[m.nat] || NATURES[9], o = {};
  STAT_KEYS.forEach((k,i) => { const v0 = Math.floor((2*b[i] + m.iv[i]) * m.lvl / 100);
    if (k === 'hp') o.hp = v0 + m.lvl + 10; else { let v = v0 + 5; if (n[1] === k) v = Math.floor(v*1.1); if (n[2] === k) v = Math.floor(v*.9); o[k] = v; } });
  return o;
}
function makeMon(sp, lvl){
  const s = SP[sp], m = {uid:G.uid++, sp, nick:null, lvl, exp:expAt(lvl), iv:STAT_KEYS.map(() => ri(0,31)), nat:ri(0, NATURES.length-1), moves:[], status:null, slp:0, hp:0};
  const learned = []; for (const [l, mv] of s.ls) if (l <= lvl && !learned.includes(mv)) learned.push(mv);
  m.moves = learned.slice(-4).map(id => ({id, pp:MOVES[id].pp})); m.hp = stats(m).hp; return m;
}
function markSeen(sp, caught){ G.seen[sp] = 1; if (caught) G.caught[sp] = 1; }
const stageMul = s => s >= 0 ? (2+s)/2 : 2/(2-s);
const STAT_ART = {atk:'El ATAQUE', def:'La DEFENSA', esp:'El ESPECIAL', vel:'La VELOCIDAD'};

async function playerAction(){

function chooseEnemyMove(){
  const e = eMon(), p = pMon(), us = e.moves.map((v,i) => ({v, i})).filter(o => o.v.pp > 0);
  if (!us.length) return -1;
  if (B.wild && !B.opt.legend) return pick(us).i;
  let best = us[0].i, bs = -1;
  for (const o of us){ const M = MOVES[o.v.id]; let s;
    if (M.p > 0) s = M.p * typeEff(M.t, SP[p.sp].t) * (SP[e.sp].t.includes(M.t) ? 1.5 : 1) * Math.min(1, M.a/100);
    else { s = 32; if (M.ss && p.status) s = 0; if (M.heal && e.hp/stats(e).hp > .5) s = 0; if (M.st){ const st = M.self ? B.stg.e : B.stg.p; if (Math.abs(st[M.st]) >= 2) s = 4; } }
    s *= .7 + rnd()*.6; if (s > bs){ bs = s; best = o.i; } }

function effSpeed(m, st){ let v = stats(m).vel*stageMul(st.vel); if (m.status === 'PAR') v *= .5; return v; }
function moveFirst(P0, pi, E0, ea){

  const pm = pi < 0 ? MOVES.forcejeo : MOVES[P0.moves[pi].id], em = ea.i < 0 ? MOVES.forcejeo : MOVES[E0.moves[ea.i].id];

async function runTurn(act){

  if (B.tr && B.potions > 0 && E0.hp > 0 && E0.hp/stats(E0).hp < .25) ea = {k:'potion'};
  if (act.k === 'run'){ if (await tryRun()){ B.over = 'run'; return; } }
  else if (act.k === 'switch'){ await withdraw(); await sendOut(act.i); }

    await doMove(side, side === 'p' ? a : a.i);

function calcDamage(a, d, M, as, ds){
  const sa = stats(a), sd = stats(d), phys = PHYS.has(M.t), crit = rnd() < 1/16, ka = phys ? 'atk' : 'esp', kd = phys ? 'def' : 'esp';
  let A = sa[ka]*stageMul(crit ? Math.max(0, as[ka]) : as[ka]), D = sd[kd]*stageMul(crit ? Math.min(0, ds[kd]) : ds[kd]);

  if (crit) dmg *= 2;
  if (SP[a.sp].t.includes(M.t)) dmg = Math.floor(dmg*1.5);
  const eff = typeEff(M.t, SP[d.sp].t);
  dmg = Math.floor(dmg*eff*ri(85,100)/100); if (eff > 0 && dmg < 1) dmg = 1;
  return {dmg, eff, crit};
}

async function addExp(m, amt, active){

const TS = {scene:new THREE.Scene(), cam:new THREE.PerspectiveCamera(34, RW/RH, .1, 80), root:null, mons:[]};
TS.scene.add(new THREE.HemisphereLight(0xffffff, 0x334477, 1.05)); { const d = new THREE.DirectionalLight(0xffffff, .7); d.position.set(-2,5,6); TS.scene.add(d); }
function setupStage(bg, ground, close){
  if (TS.root) TS.scene.remove(TS.root);
  const r = TS.root = new THREE.Group(); TS.scene.add(r); TS.mons = []; TS.scene.background = new THREE.Color(bg);
  const g = new THREE.Mesh(GEO.disc, mat(ground)); g.scale.set(3.4,.2,3.4); g.position.y = -.1; r.add(g);
  const rim = new THREE.Mesh(GEO.disc, mat(shade(ground,.3))); rim.scale.set(3.6,.16,3.6); rim.position.y = -.14; r.add(rim);
  for (let i = 0; i < 40; i++){ const s = new THREE.Mesh(GEO.box, mat(i%5 ? '#ffffff' : '#ffe8a0', {basic:1})); const a = rnd()*Math.PI*2, d = 18+rnd()*10; s.position.set(Math.sin(a)*d, 3+rnd()*12, -Math.abs(Math.cos(a)*d)-6); s.scale.setScalar(.08+rnd()*.1); r.add(s); }
  if (close){ TS.cam.position.set(0, 1.45, 5.0); TS.cam.lookAt(0, .78, 0); } else { TS.cam.position.set(0, 2.1, 7.2); TS.cam.lookAt(0, 1.55, 0); }
  return r;
}
function setupTitle(){
  const r = setupStage('#24306e', '#5aa04a'), spin = new THREE.Group(); r.add(spin); TS.spin = spin;
  ['semillo','brasito','gotin'].forEach((id, i) => { const m = buildCreature(id); const a = i/3*Math.PI*2; m.position.set(Math.sin(a)*1.6, 0, Math.cos(a)*1.6); m.rotation.y = a; m.scale.setScalar(1.15); spin.add(m); TS.mons.push(m); });
  for (let i = 0; i < 3; i++){ const o = makeOrb(['orbe','superorbe','ultraorbe'][i]); o.scale.setScalar(2); const a = (i+.5)/3*Math.PI*2; o.position.set(Math.sin(a)*1.6, .5, Math.cos(a)*1.6); spin.add(o); TS.mons.push(o); }
  VIEW.scene = TS.scene; VIEW.cam = TS.cam;
}
function updateTitle(dt){
  if (TS.spin) TS.spin.rotation.y += dt*.35;
  for (const m of TS.mons){ if (m.userData.inner) animCreature(m, dt); else if (m.userData.gem){ m.rotation.y += dt*2; m.position.y = .55 + Math.sin(G.anim*2 + m.position.x)*.12; } }
}
async function titleScreen(){
  G.mode = 'title'; setupTitle(); AU.play('title');
  const ov = page('title');
  ov.innerHTML = `<div class="tlogo"><div class="tl1">SENDEROS</div><div class="tl2">SALVAJES</div><div class="tl3">CRIATURAS DE LAS GENERACIONES I·II·III</div></div><div class="press">PULSA START</div>`;
  POST.uniforms.fade.value = 1; await fadeIn(600);
  const press = ov.querySelector('.press');
  while (true){
    press.hidden = false; press.textContent = 'PULSA START';
    await waitBtn(['start','a']); AU.sfx('ok'); press.textContent = 'CARGANDO...';
    const sv = await SAVE.loading; press.hidden = true;
    const items = sv ? ['CONTINUAR','NUEVA PARTIDA'] : ['NUEVA PARTIDA'];
    const info = sv ? mkBox('sinfo', {r:6, t:6, w:120, parent:ov}) : null;
    if (info){ const t = Math.floor(sv.played || 0); info.innerHTML = `<div><b>${esc(sv.name)}</b></div><div>INSIG. ${(sv.flags.badge1?1:0)+(sv.flags.badge2?1:0)}</div><div>REG. ${Object.keys(sv.caught || {}).length}</div><div>${Math.floor(t/3600)}:${String(Math.floor(t/60)%60).padStart(2,'0')} h</div>`; info.hidden = true; }
    const c = await choose(items, {l:84, b:14, w:120, cls:'titlem', onMove: i => { if (info) info.hidden = items[i] !== 'CONTINUAR'; }});
    if (info) info.remove();
    if (c < 0) continue;
    if (items[c] === 'CONTINUAR'){ await fadeOut(400); ov.remove(); loadGame(sv); return; }
    if (sv && !(await ask('Ya tienes una partida. Si guardas, se borrará. ¿Empezar de nuevo?'))) continue;
    await fadeOut(400); ov.remove(); await intro(); return;
  }
}
async function intro(){
  G.mode = 'script';
  const r = setupStage('#101830', '#3a4a7a', true);
  const prof = makeHuman('prof'); prof.scale.setScalar(1.35); prof.position.set(-.2, 0, .6); r.add(prof);
  const mon = buildCreature('saltin'); mon.position.set(1.3, 0, .9); mon.rotation.y = -.5; mon.scale.setScalar(.001); r.add(mon); TS.mons = [mon];
  VIEW.scene = TS.scene; VIEW.cam = TS.cam; TS.spin = null; AU.play('town');
  await fadeIn(500);
  await say('¡Hola! ¡Te doy la bienvenida al mundo de las criaturas!', 'Me llamo CEIBA, pero todo el mundo me llama la PROFESORA.');
  AU.sfx('pop'); AU.cry(SP.saltin.num); await tween(300, p => mon.scale.setScalar(Math.max(.001, easeOut(p))));
  await say('Este mundo está lleno de criaturas salvajes. Viven en praderas, bosques, cuevas y hasta en el mar.', 'Hay quien vive con ellas como compañeras y hay quien las entrena para combatir.', 'Yo me dedico a estudiarlas.');
  await say('Pero háblame de ti. ¿Eres chico o chica?', {keep:true});
  const g = await choose(['CHICO','CHICA'], {r:4, b:52, w:72, cancel:false}); tbHide();
  G.look = g === 1 ? 'heroine' : 'hero';
  r.remove(prof); const hero = makeHuman(G.look); hero.scale.setScalar(1.35); hero.position.set(-.2, 0, .6); r.add(hero);
  await say('¿Y cómo te llamas?', {keep:true});
  const defs = g === 1 ? ['LUNA','ALBA','VERA'] : ['ALEX','NICO','LEO'];
  const c = await choose(['NUEVO NOMBRE', ...defs], {l:4, t:4, w:130, cancel:false}); tbHide();
  G.name = c === 0 ? await nameEntry('¿CÓMO TE LLAMAS?') : defs[c-1];
  await say('¡Así que te llamas {P}!');
  r.remove(hero); const riv = makeHuman('rival'); riv.scale.setScalar(1.35); riv.position.set(-.2, 0, .6); r.add(riv);
  await say('Este es tu vecino. Lleva toda la vida queriendo ser mejor que tú en todo.', '...¿Cómo se llamaba?', {keep:true});
  const rc = await choose(['NUEVO NOMBRE','GAEL','BRUNO','IKER'], {l:4, t:4, w:130, cancel:false}); tbHide();
  G.rival = rc === 0 ? await nameEntry('NOMBRE DEL RIVAL') : ['GAEL','BRUNO','IKER'][rc-1];
  await say('¡Eso es! ¡Se llama {R}!');
  r.remove(riv); r.add(hero);
  await say('{P}, tu aventura está a punto de empezar.', '¡Un mundo lleno de criaturas te espera! ¡Allá vamos!');
  await fadeOut(600);
  newGame(); loadMap('casa'); placePlayer(3, 2, 'down'); VIEW.scene = WS.scene; VIEW.cam = WS.cam; AU.play('town');
  await fadeIn(500);
  G.mode = 'world';
  runScript(MAPS.casa.onEnter);
}

// ---------- Controles táctiles y página ----------
document.querySelectorAll('.btn[data-btn]').forEach(b => { const k = b.dataset.btn;
  b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch(_){} Input.press(k); });
  const up = () => Input.release(k); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') e.stopPropagation(); }); });
{ const dp = $('#dpad'); let cur = null, pid = null;
  const set = d => { if (d === cur) return; if (cur) Input.release(cur); cur = d; if (d) Input.press(d); };
  const calc = e => { const r = dp.getBoundingClientRect(), x = e.clientX - (r.left + r.width/2), y = e.clientY - (r.top + r.height/2);
    if (Math.hypot(x, y) < r.width*.1) return cur; return Math.abs(x) > Math.abs(y) ? (x > 0 ? 'right' : 'left') : (y > 0 ? 'down' : 'up'); };
  dp.addEventListener('pointerdown', e => { e.preventDefault(); pid = e.pointerId; try { dp.setPointerCapture(pid); } catch(_){} set(calc(e)); });
  dp.addEventListener('pointermove', e => { if (e.pointerId === pid) set(calc(e)); });
  const end = e => { if (e.pointerId === pid){ pid = null; set(null); } };
  dp.addEventListener('pointerup', end); dp.addEventListener('pointercancel', end); dp.addEventListener('contextmenu', e => e.preventDefault()); }
const sndBtn = $('#sndBtn');
sndBtn.addEventListener('click', () => { AU.init(); AU.setMuted(!AU.muted); sndBtn.textContent = AU.muted ? 'SONIDO: NO' : 'SONIDO: SÍ'; sndBtn.setAttribute('aria-pressed', String(!AU.muted)); });
$('#fsBtn').addEventListener('click', () => { const d = $('#device'); try { const p = document.fullscreenElement ? document.exitFullscreen() : d.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch(e){} });
const screenEl = $('#screen');
const fitPx = () => { const w = screenEl.getBoundingClientRect().width; if (w) screenEl.style.setProperty('--px', (w/RW)+'px'); };
fitPx(); if (window.ResizeObserver) new ResizeObserver(fitPx).observe(screenEl); else window.addEventListener('resize', fitPx);

// ---------- Bucle ----------
let lastT = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - lastT)/1000; lastT = now; if (!(dt > 0)) dt = 0; if (dt > .05) dt = .05;
  G.anim += dt;
  stepTweens(dt); tbUpdate(dt);
  if (VIEW.scene === WS.scene) updateWorld(dt);
  else if (VIEW.scene === BS.scene) updateBattle(dt);
  else if (VIEW.scene === TS.scene) updateTitle(dt);
  else if (VIEW.scene === EVO.scene && EVO.root){ EVO.root.children.forEach(o => { if (o.userData.inner) animCreature(o, dt); else o.rotation.z += dt*.15; }); }
  if (G.started && G.mode !== 'title'){ G.played += dt; G.time = (G.time + dt) % 1440; }
  AU.tick();
  renderFrame();
}
let booted = false;
function boot(data){
  if (booted) return; booted = true;
  setPalette(G.opts.pal);
  requestAnimationFrame(t => { lastT = t; loop(t); });
  if (data && data.save && data.save.v){ loadGame(data.save); } else titleScreen();
}
try { if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') window.claude.hot.snapshot(() => (G.started && G.mode === 'world') ? {save:makeSave()} : {}); } catch(e){}
try { if (window.claude && window.claude.hot && typeof window.claude.hot.ready === 'function') window.claude.hot.ready(boot); else boot((window.claude && window.claude.hot && window.claude.hot.data) || {}); } catch(e){ boot({}); }

</script>
